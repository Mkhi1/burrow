<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:" />
  <title>Burrow</title>
  <link rel="stylesheet" href="../../node_modules/@xterm/xterm/css/xterm.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <div class="titlebar">
        <div class="lights" id="lights"></div>
        <button class="icon-btn no-drag" id="toggle-sidebar" title="Toggle sidebar (Ctrl+Shift+B)"></button>
        <span class="brand no-drag" id="brand"></span>
      </div>
      <nav id="tree" class="tree"></nav>
      <footer class="sidebar-foot">
        <button class="icon-btn" id="add-btn" title="New (Ctrl+Shift+N)"></button>
        <div class="page-dots" id="page-dots"></div>
        <div class="foot-right">
          <button class="icon-btn" id="usage-btn" title="Token usage (Ctrl+Shift+U)"></button>
          <button class="icon-btn" id="settings-btn" title="Settings (Ctrl+,)"></button>
        </div>
      </footer>
    </aside>
    <div id="resizer"></div>
    <main id="stage">
      <div class="stage-drag"></div>
      <div id="panes" class="panes"></div>
      <div id="empty" class="empty"></div>
      <section id="usage" class="usage"></section>
      <div id="floating-bar" class="floating-bar"></div>
    </main>
  </div>
  <div id="layer"></div>
  <div id="toasts"></div>

  <script src="../../node_modules/@xterm/xterm/lib/xterm.js"></script>
  <script src="../../node_modules/@xterm/addon-fit/lib/addon-fit.js"></script>
  <script src="../../node_modules/@xterm/addon-webgl/lib/addon-webgl.js"></script>
  <script src="../../node_modules/@xterm/addon-web-links/lib/addon-web-links.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/terminals.js"></script>
  <script src="js/sidebar.js"></script>
  <script src="js/panes.js"></script>
  <script src="js/dialogs.js"></script>
  <script src="js/usage.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
